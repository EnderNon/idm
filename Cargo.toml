[package]
name = "id-mangler"
version = "0.1.0"
edition = "2024"

[dependencies]
idmangler-lib = "0.5.1"
serde = { version = "1.0", features = ["derive"] }
reqwasm = "0.5.0"
shadow-rs = { version = "1.1.1", features = ["tzdb"], default-features = false }
console_error_panic_hook = "0.1.7"
leptos = { version = "0.7.8", features = ["csr"] }

[build-dependencies]
shadow-rs = { version = "0.38.1", features = [
    "tzdb",
], default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn" }

[profile.release]
lto = true
opt-level = "s"
strip = "debuginfo"
